[project]
name = "agentmonitor-backend"
version = "0.0.0"
requires-python = ">=3.12.3,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.53.0",
  "pydantic==2.13.5",
  "SQLAlchemy==2.0.54",
  "alembic==1.20.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.8", "mypy==2.3.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests/foundation"]
pythonpath = [".."]
addopts = "--strict-config --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
