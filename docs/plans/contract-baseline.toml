schema_version = "1.0"
baseline_version = "0.2.3"
status = "draft_aligned"
owner = "integration_steward"
source_audit = "CAA-2026-09-18-01"
source_audit_path = "docs/plans/integration/contract-alignment-audit.md"
contract_version_policy = "Draft contracts propose version 1.0.0 unless an explicit compatible V2 migration retains its published boundary; CTR-COL-010 is the currently reviewed exception."
contract_count = 106
owner_approved = false
implementation_authorized = false
synchronized = false
approved = false
live_verified = false
allowed_maturities = ["proposed_aligned", "evidence_blocked"]
checklist_semantics = "A true checklist value means the dimension is explicitly carried into Draft alignment under the conventions below and must be specialized or explicitly marked not applicable during producer-consumer review. It does not mean Synchronized, Approved, Implemented, or live verified."

[aligned_conventions]
field_state_null = "Missing, null, unknown, unsupported, unavailable, not_applicable, withheld_or_denied, stale, unresolved, and exact zero are distinct; every schema specializes the applicable states."
units_time = "Exact quantities use versioned exact representations and explicit units; timestamps are aware UTC with a canonical API and persistence spelling; elapsed durations are integer milliseconds unless an explicitly suffixed field defines another unit."
auth = "Dashboard authentication, provider reauthentication health, and provider-account identity mismatch are distinct; every command/query declares principal permission and provider-profile authority where applicable."
side_effects = "Queries are side-effect free except explicitly documented bounded touches; every command and boundary declares permitted writes, external effects, deadlines, cancellation, and prohibited effects."
idempotency = "Commands declare replay scope, canonical request fingerprint, concurrency/version behavior, receipt retention, and one-time-secret non-replay rules where applicable."
events = "Events use the common envelope plus producer sequence, atomic outbox, consumer receipt/checkpoint, at-least-once deduplication, replay, incompatible-major rejection, and explicit recovery evidence where applicable."
retention = "Each persistent record, event, receipt, job, artifact, projection, backup, and evidence reference declares retention, exemption, purge authority, and export/recovery dependency."
errors = "Every boundary uses typed, allowlisted, sanitized errors; unavailable, unsupported, authentication, authorization, conflict, deadline, incompatibility, and internal failure are not collapsed."
compatibility = "Semantic producer and all consumers review version meaning; breaking nullability, unit, time, auth, event, identifier, persistence, or side-effect changes require a new major and the mandated migration or ADR."

[event_topology]
id = "CTR-EVT-TOPOLOGY-001"
status = "draft_aligned"
model = "module_owned_transactional_outboxes"
semantic_governor = "PLAN-INT"
persistence_mechanism_owner = "PLAN-DB"
producer_row_owner = "producing_module"
consumer_receipt_owner = "consuming_module"
dispatcher_access = "published_module_event_storage_ports_only"
central_event_table = false
cross_module_table_access = false
owner_approved = false
implementation_authorized = false
producer_outbox_tables = [
  { plan = "PLAN-M02", table = "reg_event_outbox" },
  { plan = "PLAN-M03", table = "provider_system_event_outbox" },
  { plan = "PLAN-M04", table = "collection_event_outbox" },
  { plan = "PLAN-M05", table = "capacity_event_outbox" },
  { plan = "PLAN-M06", table = "runtime_event_outbox" },
  { plan = "PLAN-M07", table = "alert_event_outbox" },
  { plan = "PLAN-M08", table = "ops_event_outbox" },
]
producer_delivery_table_rule = "A producer that tracks delivery attempts owns <module-prefix>event_delivery in the same migration namespace; delivery rows are not consumer processing receipts."
consumer_receipt_table_rule = "A consuming module owns its deduplication receipt and stream checkpoint under its own table prefix and commits them atomically with its domain effect and any resulting producer outbox append."
dispatcher_rule = "PLAN-DB implements reusable claim/delivery persistence mechanics; the dispatcher reaches rows only through published per-module event-storage ports and never through cross-module SQL."
transaction_rule = "A domain mutation and its producer outbox append commit or roll back together; consumer outage cannot roll back a committed producer mutation."
retention_rule = "Pending outbox rows, delivery work, consumer receipts, and checkpoints remain protected until their synchronized terminal and replay-retention conditions are satisfied."

[[resolutions]]
id = "CAA-C01"
status = "owner_approval_required_before_implementation"
decision = "Full plan and contract synchronization, the semantic planning gate, and explicit owner approval of the exact plan and contract baseline must precede any W0 production-code or test implementation. Later CS gates are implementation integration checkpoints and cannot retroactively authorize earlier work."
owner_approved = false
implementation_authorized = false

[[resolutions]]
id = "CAA-C02"
status = "accepted_alignment_direction"
decision = "Reserve dashboard_authentication_required for dashboard HTTP 401 and session recovery. Reserve provider_reauthentication_required for provider authentication state. Map them to distinct HTTP statuses and UI flows; provider failure must never clear the dashboard session."
owner_approved = false
implementation_authorized = false

[[resolutions]]
id = "CAA-C03"
status = "accepted_alignment_direction"
decision = "Use reauthentication_required as the canonical normalized provider authentication state. Any operation-specific provider outcome must have an explicit versioned mapping; changing an existing enum requires compatibility treatment."
owner_approved = false
implementation_authorized = false

[[resolutions]]
id = "CAA-C04"
status = "accepted_alignment_direction"
decision = "Every idempotent operation declares replay_policy. Normal operations may replay a safe result; one-time-secret operations return one_time_secret_not_replayable with safe resource metadata and never cache or replay plaintext."
owner_approved = false
implementation_authorized = false

[[resolutions]]
id = "CAA-C05"
status = "accepted_alignment_direction"
decision = "PLAN-M06 is the sole semantic producer of ProcessInspectionPortV1. PLAN-A04-LINUX and PLAN-A04-MAC implement it and may propose extensions only through PLAN-M06 contract review."
owner_approved = false
implementation_authorized = false

[[resolutions]]
id = "CAA-C06"
status = "accepted_alignment_direction"
decision = "CTR-PLAT-001 has one platform-neutral semantic producer. Linux and macOS are implementations or versioned extensions; one ID may not independently mean linux-platform.v1 and macos-platform.v1."
owner_approved = false
implementation_authorized = false

[[resolutions]]
id = "CAA-C07"
status = "accepted_alignment_direction"
decision = "PLAN-P01 owns API semantics and source schemas, PLAN-FND owns the generator mechanism, PLAN-INT is the sole generated-artifact writer per wave, and PLAN-P02 owns generated-client wrapper consumption."
owner_approved = false
implementation_authorized = false

[[resolutions]]
id = "CAA-C08"
status = "accepted_alignment_direction"
decision = "Use separate typed phases and receipts for PLAN-DEP artifact and unit activation, PLAN-DB database activation, and PLAN-M08 restore authority and workflow. Rollback targets must remain distinct."
owner_approved = false
implementation_authorized = false

[[resolutions]]
id = "CAA-C09"
status = "accepted_alignment_direction"
decision = "PLAN-M08 owns application maintenance intent and state. PLAN-DEP owns fenced service quiescence execution and its receipt. Competing maintenance state machines are prohibited."
owner_approved = false
implementation_authorized = false

[[resolutions]]
id = "CAA-C10"
status = "accepted_alignment_direction"
decision = "PLAN-M08 readiness consumes a narrow non-composite service-state receipt. PLAN-DEP composite status may consume PLAN-M08 readiness, never the reverse; liveness remains cycle-free."
owner_approved = false
implementation_authorized = false

[[resolutions]]
id = "CAA-C11"
status = "accepted_alignment_direction"
decision = "PLAN-M05 owns normalized capacity-health classification. PLAN-M07 owns alert activation thresholds, including the 30 percent and 15 percent defaults, and precedence. PLAN-M07 consumes PLAN-M05 and never supplies policy back to it."
owner_approved = false
implementation_authorized = false

[[resolutions]]
id = "CAA-C12"
status = "accepted_alignment_direction"
decision = "PLAN-P01 consumes provider capability and compatibility query ports plus the PLAN-M02 reauthentication application workflow only. It does not consume provider invocation gateways or adapter internals."
owner_approved = false
implementation_authorized = false

[[resolutions]]
id = "CAA-C13"
status = "accepted_alignment_direction"
decision = "Use the exact NFR-PERF-001 subjects: at least 100 registered accounts and 200 simultaneously discovered processes. AgentMonitor-owned production-path records may measure internal mechanics but do not prove provider support; no seeded accounts, processes, or telemetry are permitted, and absent real scale remains Blocked unless the requirement is formally changed."
owner_approved = false
implementation_authorized = false

[[resolutions]]
id = "CAA-C14"
status = "accepted_alignment_direction"
decision = "Use one persistence adapter layout, backend/src/agentmonitor/adapters/persistence/<module>/sqlite/, across all plans and enforce it through import and ownership checks."
owner_approved = false
implementation_authorized = false

[[resolutions]]
id = "CAA-C15"
status = "accepted_alignment_direction"
decision = "CTR-FND-001 freezes one contract package and file convention before parallel scaffolding; consumers may not add private compatibility re-exports."
owner_approved = false
implementation_authorized = false

[[resolutions]]
id = "CAA-C16"
status = "accepted_alignment_direction"
decision = "Provider extension contracts use one producer-owned versioned namespace governed by PLAN-M03; domain modules may not import provider adapter packages."
owner_approved = false
implementation_authorized = false

[[resolutions]]
id = "CAA-C17"
status = "accepted_alignment_direction"
decision = "PLAN-A01 owns the Anthropic API integration lane, PLAN-A02 owns the OpenAI API integration lane, and PLAN-A03 owns the supported Ollama API integration lane. Milestone 0 decides capability maturity, not lane ownership."
owner_approved = false
implementation_authorized = false

